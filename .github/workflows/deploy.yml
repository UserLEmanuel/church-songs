name: Deploy pe GitHub Pages

on:
  push:
    branches: [main]
  # Permite si rularea manuala din tab-ul Actions.
  workflow_dispatch:

# Permisiunile cerute de deploy-ul oficial pe Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un singur deploy o data; nu anulam un deploy deja pornit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
